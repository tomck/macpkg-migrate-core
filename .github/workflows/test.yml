name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: |
          python - <<'PY'
          import macpkg_migrate_core
          from macpkg_migrate_core import Identity
          assert macpkg_migrate_core.__version__ == "0.3.1"
          assert Identity("homebrew", "formula", "wget").native_name == "wget"
          print("installed package smoke test passed")
          PY
